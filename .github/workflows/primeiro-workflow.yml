name: Treinamento GitHub Actions
run-name: ${{ github.actor }} executando testes de CI 🚀

on: [push]

jobs:
  Inspecionar-Ambiente:
    runs-on: ubuntu-latest
    steps:
      - name: Informar evento acionador
        run: echo "Workflow disparado pelo evento ${{ github.event_name }}."

      - name: Informar SO do runner
        run: echo "Executando em uma máquina virtual ${{ runner.os }}."

      - name: Clonar repositório
        uses: actions/checkout@v4

      - name: Inspecionar arquivos clonados
        run: |
          echo "Diretório de trabalho: ${{ github.workspace }}"
          ls -la ${{ github.workspace }}

      - name: Status final
        run: echo "Status da execução: ${{ job.status }}."
